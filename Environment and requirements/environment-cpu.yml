name: femgrl-cpu

channels:
  - pyg
  - pytorch
  - conda-forge

dependencies:
  # Python 3.10 is compatible with both the training stack and the complex
  # PETSc/petsc4py builds used by the diagonal-scaling preprocessing step.
  - python=3.10
  - pip>=24.0

  # Numerical and analysis stack.
  - numpy=2.0.2
  - scipy=1.13.1
  - scikit-learn=1.6.1
  - pyamg=5.3.0
  - matplotlib=3.9.4
  - threadpoolctl=3.6.0

  # CPU-only PyTorch/PyG stack. This environment is intended for data
  # preprocessing, unit tests, plotting, and CPU AMG benchmarks.
  - pytorch=2.4.0
  - cpuonly
  - pyg=2.6.1

  # DiagScale preprocessing requires a complex-scalar PETSc build.
  - "petsc=3.24.3=complex*"
  - petsc4py=3.24.3

